services:
  - type: web
    name: cpr-auth
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: cpr-auth-data
      mountPath: /var/lib/cpr-auth/data
      sizeGB: 1
    envVars:
      - key: CPR_AUTH_PASSWORD
        generateValue: true
      - key: ONBOARDING_HOST
        value: 0.0.0.0
      - key: ONBOARDING_OUTPUT_ROOT
        value: /var/lib/cpr-auth/data
      - key: TOSUB2_TLS_PROFILE
        value: chrome
      - key: CHATGPT_BASE
        value: https://chatgpt.com
      - key: AUTH_BASE
        value: https://auth.openai.com
